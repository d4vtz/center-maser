<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
 <defs>
  <style id="current-color-scheme" type="text/css">
   .ColorScheme-Highlight { color:#3daee9; }
   .ColorScheme-Text { color:#232629; }
   .ColorScheme-Background { color:#eff0f1; }
  </style>
 </defs>

 <!-- Active frame: accent color -->
 <g class="ColorScheme-Highlight" fill="currentColor">
  <rect id="decoration-topleft" x="0" y="0" width="4" height="4"/>
  <rect id="decoration-top" x="6" y="0" width="32" height="4"/>
  <rect id="decoration-topright" x="40" y="0" width="4" height="4"/>
  <rect id="decoration-left" x="0" y="6" width="4" height="32"/>
  <rect id="decoration-right" x="40" y="6" width="4" height="32"/>
  <rect id="decoration-bottomleft" x="0" y="40" width="4" height="4"/>
  <rect id="decoration-bottom" x="6" y="40" width="32" height="4"/>
  <rect id="decoration-bottomright" x="40" y="40" width="4" height="4"/>
 </g>
 <rect id="decoration-center" class="ColorScheme-Background" fill="currentColor" x="6" y="6" width="32" height="32"/>

 <!-- Inactive frame: subdued foreground -->
 <g class="ColorScheme-Text" fill="currentColor" opacity="0.38">
  <rect id="decoration-inactive-topleft" x="60" y="0" width="3" height="3"/>
  <rect id="decoration-inactive-top" x="65" y="0" width="32" height="3"/>
  <rect id="decoration-inactive-topright" x="99" y="0" width="3" height="3"/>
  <rect id="decoration-inactive-left" x="60" y="5" width="3" height="32"/>
  <rect id="decoration-inactive-right" x="99" y="5" width="3" height="32"/>
  <rect id="decoration-inactive-bottomleft" x="60" y="39" width="3" height="3"/>
  <rect id="decoration-inactive-bottom" x="65" y="39" width="32" height="3"/>
  <rect id="decoration-inactive-bottomright" x="99" y="39" width="3" height="3"/>
 </g>
 <rect id="decoration-inactive-center" class="ColorScheme-Background" fill="currentColor" x="65" y="5" width="32" height="32"/>

 <!-- Inner borders make border sizing coherent with Aurorae -->
 <g class="ColorScheme-Highlight" fill="currentColor">
  <rect id="innerborder-topleft" x="0" y="70" width="2" height="2"/>
  <rect id="innerborder-top" x="4" y="70" width="32" height="2"/>
  <rect id="innerborder-topright" x="38" y="70" width="2" height="2"/>
  <rect id="innerborder-left" x="0" y="74" width="2" height="32"/>
  <rect id="innerborder-right" x="38" y="74" width="2" height="32"/>
  <rect id="innerborder-bottomleft" x="0" y="108" width="2" height="2"/>
  <rect id="innerborder-bottom" x="4" y="108" width="32" height="2"/>
  <rect id="innerborder-bottomright" x="38" y="108" width="2" height="2"/>
 </g>
 <rect id="innerborder-center" x="4" y="74" width="32" height="32" fill="none"/>

 <g class="ColorScheme-Text" fill="currentColor" opacity="0.38">
  <rect id="innerborder-inactive-topleft" x="60" y="70" width="1" height="1"/>
  <rect id="innerborder-inactive-top" x="63" y="70" width="32" height="1"/>
  <rect id="innerborder-inactive-topright" x="97" y="70" width="1" height="1"/>
  <rect id="innerborder-inactive-left" x="60" y="73" width="1" height="32"/>
  <rect id="innerborder-inactive-right" x="97" y="73" width="1" height="32"/>
  <rect id="innerborder-inactive-bottomleft" x="60" y="107" width="1" height="1"/>
  <rect id="innerborder-inactive-bottom" x="63" y="107" width="32" height="1"/>
  <rect id="innerborder-inactive-bottomright" x="97" y="107" width="1" height="1"/>
 </g>
 <rect id="innerborder-inactive-center" x="63" y="73" width="32" height="32" fill="none"/>

 <!-- Maximized: keep title background but no side border -->
 <rect id="decoration-maximized-center" class="ColorScheme-Background" fill="currentColor" x="120" y="0" width="32" height="32"/>
 <rect id="decoration-maximized-inactive-center" class="ColorScheme-Background" fill="currentColor" x="160" y="0" width="32" height="32"/>
</svg>
